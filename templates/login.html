<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | SecureScan</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #070a12;
            --card: rgba(13, 18, 31, 0.88);
            --border: rgba(255, 255, 255, 0.09);
            --text: #ffffff;
            --muted: #8991a4;
            --input: #0a0f1b;
            --input-border: #252c3d;
            --cyan: #00d9ff;
            --blue: #6366f1;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(0, 217, 255, 0.10),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(99, 102, 241, 0.13),
                    transparent 35%
                ),
                var(--bg);

            overflow-x: hidden;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background-grid {

            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );
        }


        .glow {

            position: fixed;

            width: 380px;
            height: 380px;

            border-radius: 50%;

            filter: blur(110px);

            opacity: 0.12;

            pointer-events: none;
        }


        .glow.one {

            top: -180px;
            left: -150px;

            background: var(--cyan);
        }


        .glow.two {

            right: -160px;
            bottom: -180px;

            background: var(--blue);
        }


        /* =====================================================
           LOGIN WRAPPER
        ===================================================== */

        .login-wrapper {

            width: 100%;
            max-width: 440px;

            position: relative;

            z-index: 5;

            animation:
                cardEnter 0.55s ease-out;
        }


        @keyframes cardEnter {

            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            position: relative;

            padding: 42px 38px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,0.035),
                    rgba(255,255,255,0.01)
                ),
                var(--card);

            border: 1px solid var(--border);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                inset 0 1px 0 rgba(255,255,255,0.045);

            overflow: hidden;
        }


        .login-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 15%;

            width: 70%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(0,217,255,0.6),
                    transparent
                );
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            width: 68px;
            height: 68px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    var(--cyan),
                    var(--blue)
                );

            box-shadow:
                0 12px 35px rgba(0,217,255,0.18);

            animation:
                logoFloat 3s ease-in-out infinite;
        }


        @keyframes logoFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-3px);
            }
        }


        .logo svg {

            width: 36px;
            height: 36px;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {

            text-align: center;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: var(--cyan);

            margin-bottom: 8px;
        }


        /* =====================================================
           HEADING
        ===================================================== */

        .title {

            text-align: center;

            font-size: 30px;

            font-weight: 750;

            letter-spacing: -0.7px;
        }


        .subtitle {

            text-align: center;

            margin-top: 9px;
            margin-bottom: 30px;

            color: var(--muted);

            font-size: 14px;

            line-height: 1.5;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {

            display: flex;

            align-items: flex-start;

            gap: 10px;

            padding: 12px 14px;

            margin-bottom: 20px;

            border-radius: 12px;

            background:
                rgba(239,68,68,0.10);

            border:
                1px solid rgba(239,68,68,0.25);

            color: #ff9999;

            font-size: 13px;

            line-height: 1.45;

            animation:
                errorEnter 0.25s ease-out;
        }


        @keyframes errorEnter {

            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        .error-icon {

            flex-shrink: 0;

            width: 18px;
            height: 18px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 19px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #d9deea;

            font-size: 13px;

            font-weight: 650;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            display: flex;

            color: #697286;

            pointer-events: none;

            transition:
                color 0.2s;
        }


        .input-icon svg {

            width: 19px;
            height: 19px;
        }


        input {

            width: 100%;

            height: 52px;

            padding:
                0 45px;

            border-radius: 12px;

            border:
                1px solid var(--input-border);

            outline: none;

            background:
                rgba(7,11,20,0.8);

            color: white;

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }


        input::placeholder {

            color: #555e70;
        }


        input:hover {

            border-color:
                #323a4e;
        }


        input:focus {

            border-color:
                rgba(0,217,255,0.75);

            background:
                rgba(10,16,28,0.95);

            box-shadow:
                0 0 0 3px
                rgba(0,217,255,0.09);
        }


        input:focus + .input-focus-line {
            transform: scaleX(1);
        }


        .input-focus-line {

            position: absolute;

            bottom: 0;
            left: 12%;

            width: 76%;
            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--cyan),
                    transparent
                );

            transform:
                scaleX(0);

            transition:
                transform 0.25s;

            pointer-events: none;
        }


        /* =====================================================
           PASSWORD TOGGLE
        ===================================================== */

        .password-toggle {

            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: none;

            border-radius: 8px;

            background: transparent;

            color: #6f788b;

            cursor: pointer;

            transition:
                background 0.2s,
                color 0.2s;
        }


        .password-toggle:hover {

            background:
                rgba(255,255,255,0.06);

            color: white;
        }


        .password-toggle svg {

            width: 19px;
            height: 19px;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            position: relative;

            width: 100%;
            height: 53px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00c8ed,
                    #6366f1
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            letter-spacing: 0.1px;

            cursor: pointer;

            overflow: hidden;

            transition:
                transform 0.2s,
                box-shadow 0.2s,
                opacity 0.2s;
        }


        .login-button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.18),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                left 0.5s;
        }


        .login-button:hover::before {

            left: 130%;
        }


        .login-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 14px 32px
                rgba(0,200,237,0.18);
        }


        .login-button:active {

            transform:
                translateY(0);
        }


        .login-button:disabled {

            cursor: not-allowed;

            opacity: 0.7;

            transform: none;

            box-shadow: none;
        }


        .button-content {

            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;
        }


        /* =====================================================
           LOADING SPINNER
        ===================================================== */

        .spinner {

            width: 17px;
            height: 17px;

            border-radius: 50%;

            border:
                2px solid rgba(255,255,255,0.35);

            border-top-color:
                white;

            animation:
                spin 0.7s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }
        }


        /* =====================================================
           REGISTER
        ===================================================== */

        .register-text {

            text-align: center;

            margin-top: 25px;

            color: #747d90;

            font-size: 13px;
        }


        .register-text a {

            color: var(--cyan);

            text-decoration: none;

            font-weight: 650;

            margin-left: 4px;
        }


        .register-text a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           SECURITY NOTE
        ===================================================== */

        .security-note {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            margin-top: 24px;

            color: #5f6879;

            font-size: 11px;
        }


        .security-dot {

            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 9px
                rgba(34,197,94,0.55);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            body {
                padding: 14px;
            }

            .login-card {

                padding:
                    34px 24px;

                border-radius: 20px;
            }

            .logo {

                width: 62px;
                height: 62px;

                border-radius: 18px;
            }

            .title {

                font-size: 26px;
            }
        }


        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;
            }
        }

    </style>
</head>


<body>

    <div class="background-grid"></div>

    <div class="glow one"></div>
    <div class="glow two"></div>


    <main class="login-wrapper">

        <section class="login-card">


            <!-- =================================================
                 LOGO
            ================================================== -->

            <div class="logo">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="white"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <path
                        d="M12 3L20 6V11C20 16.2 16.6 20 12 21C7.4 20 4 16.2 4 11V6L12 3Z"
                    />

                    <path
                        d="M9 12L11 14L15 10"
                    />

                </svg>

            </div>


            <!-- =================================================
                 BRAND
            ================================================== -->

            <div class="brand">
                SecureScan
            </div>


            <!-- =================================================
                 HEADING
            ================================================== -->

            <h1 class="title">
                Welcome back
            </h1>

            <p class="subtitle">
                Sign in to access your security dashboard
            </p>


            <!-- =================================================
                 ERROR
            ================================================== -->

            {% if error_message %}

            <div
                class="error"
                role="alert"
            >

                <svg
                    class="error-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="10"
                    />

                    <line
                        x1="12"
                        y1="8"
                        x2="12"
                        y2="12"
                    />

                    <circle
                        cx="12"
                        cy="16"
                        r="0.5"
                        fill="currentColor"
                    />

                </svg>

                <span>
                    {{ error_message }}
                </span>

            </div>

            {% endif %}


            <!-- =================================================
                 LOGIN FORM
            ================================================== -->

            <form
                id="loginForm"
                method="POST"
                action="{{ url_for('login') }}"
            >


                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M20 21a8 8 0 0 0-16 0"
                                />

                                <circle
                                    cx="12"
                                    cy="7"
                                    r="4"
                                />

                            </svg>

                        </span>


                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                            autofocus
                        >

                        <span class="input-focus-line"></span>

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <rect
                                    x="3"
                                    y="11"
                                    width="18"
                                    height="10"
                                    rx="2"
                                />

                                <path
                                    d="M7 11V7a5 5 0 0 1 10 0v4"
                                />

                            </svg>

                        </span>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            id="passwordToggle"
                            class="password-toggle"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >

                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                />

                            </svg>

                        </button>


                        <span class="input-focus-line"></span>

                    </div>

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================== -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span class="button-content">

                        <span id="buttonText">
                            Sign In
                        </span>

                    </span>

                </button>

            </form>


            <!-- =================================================
                 REGISTER
            ================================================== -->

            <div class="register-text">

                Don't have an account?

                <a href="{{ url_for('register') }}">
                    Create account
                </a>

            </div>


            <!-- =================================================
                 SECURITY
            ================================================== -->

            <div class="security-note">

                <span class="security-dot"></span>

                Secure authentication enabled

            </div>

        </section>

    </main>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        /* -----------------------------------------------------
           PASSWORD SHOW / HIDE
        ----------------------------------------------------- */

        const password =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("passwordToggle");

        const eyeIcon =
            document.getElementById("eyeIcon");


        passwordToggle.addEventListener(
            "click",
            function () {

                const isHidden =
                    password.type === "password";


                password.type =
                    isHidden
                        ? "text"
                        : "password";


                passwordToggle.setAttribute(
                    "aria-label",
                    isHidden
                        ? "Hide password"
                        : "Show password"
                );


                if (isHidden) {

                    eyeIcon.innerHTML = `

                        <path
                            d="M3 3L21 21"
                        />

                        <path
                            d="M10.6 10.6
                               A2 2 0 0 0
                               13.4 13.4"
                        />

                        <path
                            d="M9.9 4.2
                               C10.6 4.1
                               11.3 4
                               12 4
                               C18.5 4
                               22 12
                               22 12
                               C21.3 13.5
                               20.2 15.1
                               18.8 16.5"
                        />

                        <path
                            d="M6.2 6.2
                               C3.5 8.1
                               2 12
                               2 12
                               C2 12
                               5.5 20
                               12 20
                               C13.5 20
                               14.9 19.6
                               16.2 19"
                        />

                    `;

                } else {

                    eyeIcon.innerHTML = `

                        <path
                            d="M2 12s3.5-7 10-7
                               10 7 10 7
                               -3.5 7-10 7
                               S2 12 2 12Z"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="3"
                        />

                    `;
                }

            }
        );


        /* -----------------------------------------------------
           LOGIN BUTTON LOADING STATE
        ----------------------------------------------------- */

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const buttonText =
            document.getElementById("buttonText");


        loginForm.addEventListener(
            "submit",
            function () {

                loginButton.disabled = true;

                buttonText.innerHTML = `

                    <span
                        class="spinner"
                    ></span>

                    Signing in...

                `;
            }
        );

    </script>

</body>
</html>
