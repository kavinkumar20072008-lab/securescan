<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | SecureScan</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    #16213e,
                    transparent 40%
                ),

                radial-gradient(
                    circle at bottom right,
                    #0f3460,
                    transparent 40%
                ),

                #080b14;

            color: #ffffff;

            overflow: hidden;
        }


        /* =====================================================
           BACKGROUND
        ===================================================== */

        .background-grid {

            position: fixed;

            inset: 0;

            background-image:

                linear-gradient(
                    rgba(255,255,255,0.025)
                    1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025)
                    1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            pointer-events: none;
        }


        .glow {

            position: fixed;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.18;

            pointer-events: none;
        }


        .glow.one {

            background: #00d9ff;

            top: -120px;

            left: -120px;
        }


        .glow.two {

            background: #7c3aed;

            bottom: -150px;

            right: -100px;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .register-wrapper {

            width: 100%;

            max-width: 460px;

            padding: 20px;

            position: relative;

            z-index: 2;
        }


        .register-card {

            background:
                rgba(15, 20, 35, 0.82);

            border:
                1px solid
                rgba(255,255,255,0.09);

            border-radius: 24px;

            padding: 40px 38px;

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:

                0 25px 70px
                rgba(0,0,0,0.45),

                inset 0 1px 0
                rgba(255,255,255,0.04);
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            width: 64px;

            height: 64px;

            margin:
                0 auto 18px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #00c8ed,
                    #6366f1
                );

            box-shadow:
                0 10px 30px
                rgba(0,217,255,0.20);
        }


        .logo svg {

            width: 34px;

            height: 34px;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .title {

            text-align: center;

            font-size: 29px;

            font-weight: 700;

            letter-spacing: -0.5px;
        }


        .subtitle {

            text-align: center;

            margin-top: 9px;

            margin-bottom: 28px;

            color: #9299aa;

            font-size: 14px;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .error {

            background:
                rgba(239,68,68,0.12);

            border:
                1px solid
                rgba(239,68,68,0.3);

            color: #ff8d8d;

            padding: 12px 14px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-size: 14px;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #d8dce5;

            font-size: 14px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        .input-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #72798a;

            display: flex;

            pointer-events: none;
        }


        .input-icon svg {

            width: 19px;

            height: 19px;
        }


        input {

            width: 100%;

            height: 50px;

            padding:
                0 15px 0 45px;

            border-radius: 12px;

            border:
                1px solid #292f40;

            background: #0c101c;

            color: white;

            outline: none;

            font-size: 14px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }


        input::placeholder {

            color: #5e6575;
        }


        input:focus {

            border-color: #00c8ed;

            background: #0e1321;

            box-shadow:
                0 0 0 3px
                rgba(0,200,237,0.10);
        }


        /* =====================================================
           PASSWORD
        ===================================================== */

        .password-wrapper input {

            padding-right: 48px;
        }


        .password-toggle {

            position: absolute;

            right: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            background: none;

            border: none;

            color: #737b8d;

            cursor: pointer;

            padding: 5px;
        }


        .password-toggle:hover {

            color: #ffffff;
        }


        .password-toggle svg {

            width: 19px;

            height: 19px;
        }


        /* =====================================================
           PASSWORD STRENGTH
        ===================================================== */

        .password-strength {

            margin-top: 8px;

            display: flex;

            gap: 5px;
        }


        .strength-bar {

            height: 3px;

            flex: 1;

            background: #252b3a;

            border-radius: 10px;

            transition:
                background 0.2s;
        }


        .strength-text {

            margin-top: 7px;

            font-size: 11px;

            color: #687082;
        }


        /* =====================================================
           REGISTER BUTTON
        ===================================================== */

        .register-button {

            width: 100%;

            height: 52px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00c8ed,
                    #6366f1
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            margin-top: 8px;

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .register-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(0,200,237,0.20);
        }


        .register-button:active {

            transform:
                translateY(0);
        }


        /* =====================================================
           LOGIN LINK
        ===================================================== */

        .login-text {

            text-align: center;

            margin-top: 25px;

            color: #777f91;

            font-size: 14px;
        }


        .login-text a {

            color: #00c8ed;

            text-decoration: none;

            font-weight: 600;
        }


        .login-text a:hover {

            text-decoration: underline;
        }


        /* =====================================================
           SECURITY
        ===================================================== */

        .security-note {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 22px;

            color: #626a7b;

            font-size: 12px;
        }


        .security-dot {

            width: 7px;

            height: 7px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 8px
                rgba(34,197,94,0.5);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 500px) {

            .register-wrapper {

                padding: 15px;
            }

            .register-card {

                padding:
                    34px 25px;

                border-radius: 20px;
            }

            .title {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>


<div class="background-grid"></div>

<div class="glow one"></div>

<div class="glow two"></div>


<div class="register-wrapper">

    <div class="register-card">


        <!-- =================================================
             LOGO
        ================================================== -->

        <div class="logo">

            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="white"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="
                    M12 3
                    L20 6
                    V11
                    C20 16.2
                    16.6 20
                    12 21
                    C7.4 20
                    4 16.2
                    4 11
                    V6
                    L12 3Z
                    "
                />

                <path
                    d="M9 12L11 14L15 10"
                />

            </svg>

        </div>


        <!-- =================================================
             TITLE
        ================================================== -->

        <h1 class="title">
            Create your account
        </h1>


        <p class="subtitle">
            Start securing your network with SecureScan
        </p>


        <!-- =================================================
             ERROR MESSAGE
        ================================================== -->

        {% if error_message %}

        <div class="error">

            {{ error_message }}

        </div>

        {% endif %}


        <!-- =================================================
             REGISTER FORM
        ================================================== -->

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >


            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="
                                M20 21
                                A8 8 0 0 0
                                4 21
                                "
                            />

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            />

                        </svg>

                    </span>


                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        autocomplete="username"
                        minlength="3"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email address
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            />

                            <path
                                d="M3 7L12 13L21 7"
                            />

                        </svg>

                    </span>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper password-wrapper">

                    <span class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <rect
                                x="3"
                                y="11"
                                width="18"
                                height="10"
                                rx="2"
                            />

                            <path
                                d="
                                M7 11V7
                                A5 5 0 0 1
                                17 7V11
                                "
                            />

                        </svg>

                    </span>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                        oninput="checkPasswordStrength()"
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', 'passwordIcon')"
                        aria-label="Show password"
                    >

                        <svg
                            id="passwordIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="
                                M2 12
                                S5.5 5
                                12 5
                                S22 12
                                22 12
                                S18.5 19
                                12 19
                                S2 12
                                2 12Z
                                "
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                        </svg>

                    </button>

                </div>


                <div class="password-strength">

                    <span
                        class="strength-bar"
                        id="bar1"
                    ></span>

                    <span
                        class="strength-bar"
                        id="bar2"
                    ></span>

                    <span
                        class="strength-bar"
                        id="bar3"
                    ></span>

                    <span
                        class="strength-bar"
                        id="bar4"
                    ></span>

                </div>


                <div
                    class="strength-text"
                    id="strengthText"
                >
                    Use at least 6 characters
                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm password
                </label>

                <div class="input-wrapper password-wrapper">

                    <span class="input-icon">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <rect
                                x="3"
                                y="11"
                                width="18"
                                height="10"
                                rx="2"
                            />

                            <path
                                d="
                                M7 11V7
                                A5 5 0 0 1
                                17 7V11
                                "
                            />

                        </svg>

                    </span>


                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >


                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirm_password', 'confirmIcon')"
                        aria-label="Show password"
                    >

                        <svg
                            id="confirmIcon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <path
                                d="
                                M2 12
                                S5.5 5
                                12 5
                                S22 12
                                22 12
                                S18.5 19
                                12 19
                                S2 12
                                2 12Z
                                "
                            />

                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />

                        </svg>

                    </button>

                </div>

            </div>


            <!-- REGISTER -->

            <button
                type="submit"
                class="register-button"
                onclick="return validatePasswords()"
            >
                Create Account
            </button>


        </form>


        <!-- =================================================
             LOGIN LINK
        ================================================== -->

        <div class="login-text">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Sign in
            </a>

        </div>


        <!-- =================================================
             SECURITY
        ================================================== -->

        <div class="security-note">

            <span class="security-dot"></span>

            Passwords are securely hashed

        </div>


    </div>

</div>


<script>


/* ==========================================================
   PASSWORD VISIBILITY
========================================================== */

function togglePassword(
    inputId,
    iconId
) {

    const input =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (input.type === "password") {

        input.type = "text";


        icon.innerHTML = `

            <path
                d="M3 3L21 21"
            />

            <path
                d="
                M10.6 10.6
                A2 2 0 0 0
                13.4 13.4
                "
            />

            <path
                d="
                M9.9 4.2
                C10.6 4.1
                11.3 4
                12 4
                C18.5 4
                22 12
                22 12
                C21.3 13.5
                20.2 15.1
                18.8 16.5
                "
            />

            <path
                d="
                M6.2 6.2
                C3.5 8.1
                2 12
                2 12
                C2 12
                5.5 20
                12 20
                C13.5 20
                14.9 19.6
                16.2 19
                "
            />

        `;

    }

    else {

        input.type = "password";


        icon.innerHTML = `

            <path
                d="
                M2 12
                S5.5 5
                12 5
                S22 12
                22 12
                S18.5 19
                12 19
                S2 12
                2 12Z
                "
            />

            <circle
                cx="12"
                cy="12"
                r="3"
            />

        `;
    }
}


/* ==========================================================
   PASSWORD STRENGTH
========================================================== */

function checkPasswordStrength() {

    const password =
        document.getElementById("password").value;


    const bars = [

        document.getElementById("bar1"),

        document.getElementById("bar2"),

        document.getElementById("bar3"),

        document.getElementById("bar4")

    ];


    const text =
        document.getElementById("strengthText");


    let strength = 0;


    if (password.length >= 6) {

        strength++;
    }


    if (password.length >= 8) {

        strength++;
    }


    if (/[A-Z]/.test(password)) {

        strength++;
    }


    if (/[0-9!@#$%^&*]/.test(password)) {

        strength++;
    }


    bars.forEach(
        bar => {

            bar.style.background =
                "#252b3a";

        }
    );


    if (strength === 0) {

        text.textContent =
            "Use at least 6 characters";

    }

    else if (strength === 1) {

        text.textContent =
            "Weak password";

        bars[0].style.background =
            "#ef4444";

    }

    else if (strength === 2) {

        text.textContent =
            "Fair password";

        bars[0].style.background =
            "#f59e0b";

        bars[1].style.background =
            "#f59e0b";

    }

    else if (strength === 3) {

        text.textContent =
            "Good password";

        bars[0].style.background =
            "#22c55e";

        bars[1].style.background =
            "#22c55e";

        bars[2].style.background =
            "#22c55e";

    }

    else {

        text.textContent =
            "Strong password";

        bars.forEach(
            bar => {

                bar.style.background =
                    "#22c55e";

            }
        );
    }
}


/* ==========================================================
   CONFIRM PASSWORD
========================================================== */

function validatePasswords() {

    const password =
        document.getElementById("password").value;

    const confirm =
        document.getElementById("confirm_password").value;


    if (password !== confirm) {

        alert(
            "Passwords do not match."
        );

        return false;
    }


    return true;
}

</script>


</body>

</html>
